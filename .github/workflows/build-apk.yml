name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "NewBlackbox commit to build against"
        required: false
        default: "89b59836c66f173756a4ae258cf379a957649820"

permissions:
  contents: write

env:
  # Engine commit this overlay was written against.
  DEFAULT_ENGINE_REF: "89b59836c66f173756a4ae258cf379a957649820"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform, build tools and NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Fetch the engine
        run: |
          REF="${{ github.event.inputs.engine_ref }}"
          REF="${REF:-$DEFAULT_ENGINE_REF}"
          mkdir engine
          cd engine
          git init -q
          git remote add origin https://github.com/ALEX5402/NewBlackbox.git
          git fetch --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD

      - name: Apply overlay
        run: python3 scripts/apply_overlay.py engine

      - name: Use a fixed signing key
        env:
          # Optional: a base64 copy of your own keystore (alias androiddebugkey, password android).
          # When this secret exists it is used instead of signing/debug.keystore.
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          # Android installs an update over an installed app only when both are signed with the same
          # key. A debug build normally gets a fresh random key on every run, so each update had to
          # be installed after an uninstall, which also erased everything inside the container.
          KEYDIR="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$KEYDIR"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYDIR/debug.keystore"
            echo "Signing with the key from the DEBUG_KEYSTORE_B64 secret"
          else
            cp signing/debug.keystore "$KEYDIR/debug.keystore"
            echo "Signing with signing/debug.keystore from this repository"
          fi
          echo "DEBUG_KEYSTORE=$KEYDIR/debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APKs
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          find engine/app/build/outputs/apk/debug -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Check the APKs are signed with the fixed key
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          WANT=$(keytool -list -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$WANT" ]; then echo "::error::could not read the signing key"; exit 1; fi
          echo "expected signer: $WANT"
          for apk in out/*.apk; do
            GOT=$("$APKSIGNER" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' | head -1)
            echo "$(basename "$apk") is signed by $GOT"
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::$(basename "$apk") is not signed with the fixed key"
              exit 1
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bg-app-runner-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "BG App Runner build ${{ github.run_number }}" \
            --notes "Debug-signed APKs. Use the arm64-v8a file on most phones."
